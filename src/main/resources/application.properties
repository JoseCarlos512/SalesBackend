spring.application.name=sys_factu.com.pe

# Server
server.port=${SERVER_PORT:9898}
server.servlet.context-path=/api

# DataSource — override via env vars in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dsistemaventas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# JWT — MUST be overridden in production via JWT_SECRET env var
jwt.secret=${JWT_SECRET:change-this-secret-in-production-must-be-at-least-32-bytes!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS — comma-separated origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

# ── SUNAT ─────────────────────────────────────────────────────────────────────
# Datos del emisor (tu empresa)
sunat.ruc=${SUNAT_RUC:20000000001}
sunat.razon-social=${SUNAT_RAZON_SOCIAL:MI EMPRESA SAC}
sunat.nombre-comercial=${SUNAT_NOMBRE_COMERCIAL:MI EMPRESA}
sunat.direccion=${SUNAT_DIRECCION:AV. PRINCIPAL 123, LIMA}
sunat.ubigeo=${SUNAT_UBIGEO:150101}
sunat.distrito=${SUNAT_DISTRITO:LIMA}
sunat.provincia=${SUNAT_PROVINCIA:LIMA}
sunat.departamento=${SUNAT_DEPARTAMENTO:LIMA}

# Credenciales SOL SUNAT (usuario secundario: RUC + usuario, ej: 20000000001MODDATOS)
sunat.username=${SUNAT_USERNAME:20000000001MODDATOS}
sunat.password=${SUNAT_PASSWORD:moddatos}

# Ambiente: beta | produccion
sunat.ambiente=${SUNAT_AMBIENTE:beta}

# Certificado digital (.p12 / .pfx)
# En beta puedes usar el certificado demo de SUNAT
sunat.certificate.path=${SUNAT_CERT_PATH:classpath:cert/demo.pfx}
sunat.certificate.password=${SUNAT_CERT_PASSWORD:demo}
sunat.certificate.alias=${SUNAT_CERT_ALIAS:}

# Logging
logging.level.root=WARN
logging.level.sys_facturation.com=INFO
logging.level.org.springframework.security=WARN
