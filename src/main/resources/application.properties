spring.application.name=sys_factu.com.pe

# Server
server.port=${SERVER_PORT:9898}
server.servlet.context-path=/api

# DataSource — override via env vars in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dsistemaventas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# JWT — MUST be overridden in production via JWT_SECRET env var
jwt.secret=${JWT_SECRET:change-this-secret-in-production-must-be-at-least-32-bytes!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS — comma-separated origins allowed by the global CORS config
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

# Logging
logging.level.root=WARN
logging.level.sys_facturation.com=INFO
logging.level.org.springframework.security=WARN
